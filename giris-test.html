
<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bir Artı Bir - Giriş Testi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #243a5a, #0b1220 70%);
      color: #e5edf8;
      font: 15px Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 18px;
      background: #152238;
      border: 1px solid #304866;
      text-align: center;
    }
    h1 { margin: 10px 0; }
    p { color: #9aabc2; }
    .tabs {
      display: flex;
      gap: 6px;
      margin: 24px 0;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 12px;
      color: white;
      background: #2563eb;
      font-weight: bold;
      cursor: pointer;
    }
    .tabs button {
      flex: 1;
      background: #263852;
    }
    .tabs button.active {
      background: #2563eb;
    }
    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #304866;
      border-radius: 9px;
      background: #1c2d45;
      color: white;
    }
    .submit { width: 100%; }
    .hidden { display: none; }
    .note { font-size: 12px; }
    .notice {
      margin-top: 16px;
      color: #facc15;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div style="font-size:42px">🎧</div>
    <h1>Bir Artı Bir</h1>
    <p>Arkadaşlarınla buluş, konuş ve eğlen!</p>

    <div class="tabs">
      <button class="active" data-tab="guest">Misafir</button>
      <button data-tab="login">Giriş Yap</button>
      <button data-tab="register">Kayıt Ol</button>
    </div>

    <section id="guest">
      <input placeholder="Misafir kullanıcı adı" maxlength="20">
      <button class="submit" type="button">Misafir Olarak Gir</button>
      <p class="note">Şifre gerektirmez ❤️</p>
    </section>

    <section id="login" class="hidden">
      <input placeholder="Kullanıcı adı" autocomplete="username">
      <input type="password" placeholder="Şifre" autocomplete="current-password">
      <button class="submit" type="button">Giriş Yap</button>
    </section>

    <section id="register" class="hidden">
      <input placeholder="Kullanıcı adı (3-20 karakter)" maxlength="20">
      <input type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="new-password">
      <button class="submit" type="button">Hesap Oluştur</button>
      <p class="note">E-posta istenmez.</p>
    </section>

    <p class="notice" id="notice">
      🧪 Test ekranı — hesap işlemleri henüz aktif değil.
    </p>
  </main>

  <script>
    const tabs = document.querySelectorAll("[data-tab]");
    const sections = ["guest", "login", "register"];

    tabs.forEach(button => {
      button.addEventListener("click", () => {
        tabs.forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        sections.forEach(id => {
          document.getElementById(id).classList.toggle(
            "hidden",
            id !== button.dataset.tab
          );
        });
      });
    });

    document.querySelectorAll(".submit").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("notice").textContent =
          "🧪 Bu bir önizleme. Gerçek giriş ve kayıt henüz etkin değil.";
      });
    });
  </script>
</body>
</html>
